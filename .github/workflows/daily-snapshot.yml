# 每天在 GitHub 上自己回補行情、重算排行、發佈靜態網站，本機不用開機。
#
# 行情快取放在同一個 repo 的 data 分支（`imports/yyyy-MM-dd.json`），
# 開跑前取下來、回補完推回去，所以每天只需要下載新增的那一天。
# 快取不放進 main 是因為它每天都在長，塞進原始碼的歷史裡會讓 clone 越來越重。

name: 每日排行快照

on:
  schedule:
    # 台北時間 16:07（= UTC 08:07）先把 runner 卡住，下面再自己睡到 18:00 才開抓。
    # GitHub 的排程是盡力而為，實測誤點過 31 分鐘，直接排 18:00 就會變成 18:31 才動。
    # 分鐘避開整點與半點，那是所有人排程的尖峰、誤點最嚴重。
    - cron: '7 8 * * 1-5'

  # 想立刻更新時可以手動觸發，也可以指定要回補幾個交易日。
  workflow_dispatch:
    inputs:
      trading-days:
        description: 回補幾個交易日（從今天往回）
        default: '300'
      publish-only:
        description: 只用 data 分支現有快取重新輸出並發布，不等待今日行情
        type: boolean
        default: false

permissions:
  contents: write

# 完整快照會寫入 data 分支，彼此不能重疊；publish-only 只讀 data 並發布網站，
# 可以和完整快照並行，避免備份或回補卡住時連純畫面發布也被排隊。
concurrency:
  group: ${{ inputs.publish-only == true && 'daily-snapshot-publish' || 'daily-snapshot' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 16:07 進場、睡到 18:00、最晚重試到 21:00，再加上發佈，七小時夠用。
    timeout-minutes: 420

    env:
      # 官方行情以台北時間為準，回補的「今天」也必須是台北的今天。
      TZ: Asia/Taipei
      TRADING_DAYS: ${{ inputs.trading-days || '300' }}

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 取出行情快取
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          # 等一下要從這裡 push，淺層 clone 有機會被拒絕。
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 驗證計算公式
        run: dotnet test -c Release

      # 排程提早進場是為了搶 runner，不是為了提早抓。收盤行情下午三點才公布，
      # 太早抓只會抓到空的，所以睡到 18:00 整再開始。手動觸發時不等。
      # 18:00 這個時間定義在 CollectionSchedule.DailyRefresh（前端也讀同一份），
      # YAML 讀不到 C#，改那邊要順手改這裡。
      - name: 等到 18:00
        if: ${{ github.event_name == 'schedule' }}
        run: |
          wait=$(( $(date -d '18:00' +%s) - $(date +%s) ))

          if [ "$wait" -le 0 ]; then
              echo "現在 $(date +%H:%M)，已經過 18:00，直接開抓。"
              exit 0
          fi

          echo "現在 $(date +%H:%M)，睡 $(( wait / 60 )) 分鐘到 18:00。"
          sleep "$wait"

      # 抓到有為止：官方偶爾晚公布或擋一下，一次失敗不算數，
      # 每 10 分鐘重跑一次直到今天的行情檔案落地，最晚撐到 21:00。
      - name: 回補行情
        if: ${{ inputs.publish-only != true }}
        run: |
          today=$(date +%Y-%m-%d)
          deadline=$(date -d '21:00' +%s)
          attempt=0

          while true; do
              attempt=$(( attempt + 1 ))

              echo "::group::第 $attempt 次回補（$(date +%H:%M:%S)）"
              dotnet run -c Release --project src/Invest.Web -- backfill "$TRADING_DAYS" || true
              echo "::endgroup::"

              if [ -f "data/imports/$today.json" ]; then
                  echo "$today 的行情已經寫進快取，第 $attempt 次成功。"
                  exit 0
              fi

              if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "撐到 21:00 還是沒有 $today 的行情，試了 $attempt 次。" >&2
                  echo "今天若是國定假日，這個紅燈是預期內的；否則就是官方沒公布或被擋。" >&2
                  exit 1
              fi

              echo "還沒有 $today 的行情，10 分鐘後再試。"
              sleep 600
          done

      # 靜態站可選最近 120 個交易日，任一檢視日都要再向前畫三個月日 K。
      # 因此回補範圍要與本輪行情資料窗相同（預設 300），不能只補最近 90 天；
      # 已完整的日期會略過，不重算成交值，也不重新下載整份歷史行情。
      #
      # 這一步允許失敗。backfill-bars 只要有任何一天沒抓到就 exit 1，
      # 而它一次要顧三百個交易日，官方偶爾漏掉某一天是常態；下一輪會自動重試
      # 同一批日期。真的補不回來時，靜態站的日 K 會自己掛上「資料不足」，
      # 該看見的還是看得見。
      #
      # 反過來說，讓它把整輪判成失敗的代價很實在：最後那一步的鈴鐺會亮紅燈說
      # 「排行可能還停在前一個交易日」——但排行明明已經發佈成功了。
      # 鈴鐺喊過幾次狼來了，真的壞掉那天就不會有人理它。
      - name: 補抓完整資料窗日 K
        if: ${{ inputs.publish-only != true }}
        continue-on-error: true
        run: dotnet run -c Release --project src/Invest.Web -- backfill-bars "$TRADING_DAYS"

      - name: 保存行情快取
        if: ${{ inputs.publish-only != true }}
        working-directory: data
        run: |
          git add -A imports

          # 行情只增不減。真的少了檔案代表出了意外，寧可讓整個流程停在這裡，
          # 也不要把「刪掉歷史」這件事推上去。
          if git diff --cached --name-only --diff-filter=D | grep -q .; then
              echo "偵測到行情檔案被刪除，中止：" >&2
              git diff --cached --name-only --diff-filter=D >&2
              exit 1
          fi

          if git diff --cached --quiet; then
              echo "沒有新的交易日，快取不變。"
              exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "行情快取 $(date +%Y-%m-%d)"
          git push -q

      # 以下每一步都用 !cancelled()，讓它們彼此不互相拖累。
      # 串成一條的話，回補失敗就等於同步、備份、發佈全部沒跑，
      # 而且只會看到最前面那個錯誤。任何一步紅了整個 job 還是紅的。
      # publish-only 只重建網站，不改 data、Supabase 或備份，避免盤中手動發布時
      # 為了等今天尚未公布的行情卡住整個發布流程。

      - name: 同步到 Supabase
        if: ${{ !cancelled() && inputs.publish-only != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: dotnet run -c Release --project src/Invest.Web -- sync

      # 重大訊息跟營收不一樣，不能另外開一條流程慢慢跑：它要在下面的匯出之前進資料庫，
      # 當天的催化事件才會出現在當天發佈的網站上。
      #
      # 會多帶 --backfill 5：OpenAPI 那一份給的是「最近一個發言日」，實測比今天慢一天，
      # 所以只抓它會永遠差一天。回補的前三天一律重抓，把當天還在陸續補進來的那些收齊。
      - name: 更新重大訊息
        if: ${{ !cancelled() && inputs.publish-only != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: dotnet run -c Release --project src/Invest.Web -- material-events --backfill 5

      - name: 對帳
        if: ${{ !cancelled() && inputs.publish-only != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: dotnet run -c Release --project src/Invest.Web -- verify

      # runner 內建的是 pg_dump 16，Supabase 已經是 PostgreSQL 17，
      # 版本對不上 pg_dump 會直接拒絕匯出（不是警告，是 exit 1）。
      # runner 內建的套件庫只到 16，所以要自己掛上 PostgreSQL 官方的 pgdg。
      #
      # 裝好還不夠：`/usr/bin/pg_dump` 是 pg_wrapper，runner 上有 16 的預設 cluster，
      # 它就照那個挑 16，裝了 17 也一樣。所以直接把 17 的執行檔位置交給備份腳本。
      - name: 裝上對得上 Supabase 的 pg_dump
        if: ${{ !cancelled() && inputs.publish-only != true }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]" \
              "https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          echo "PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: 備份原生資料
        if: ${{ !cancelled() && inputs.publish-only != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/backup-supabase.sh data/snapshots

      # export 大部分吃 data/imports 的行情快取，唯一要連資料庫的是重大訊息
      # （material_events）——催化事件頁與族群新聞熱度都讀它。沒帶這個 secret 時
      # 程式不會炸，只會記一行「讀取重大訊息失敗」然後把那兩塊發成空的，
      # 網站看起來一切正常但催化事件是空白頁，所以這行漏掉不會有人發現。
      - name: 輸出靜態網站
        if: ${{ !cancelled() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: dotnet run -c Release --project src/Invest.Web -- export "$GITHUB_WORKSPACE/publish/site"

      # 舊網址（qwe953751.github.io/Investment/）已收掉內容：不帶 GH_PAGES_ADMIN_SUBDIR，
      # publish-gh-pages.sh 只會發一頁空白頁，訪客看不到任何排行資料。這個 repo
      # 的 gh-pages 分支還留著（沒關 Pages），但打開網址什麼都看不到。
      - name: 發佈到 GitHub Pages（舊網址，僅留空白頁）
        if: ${{ !cancelled() }}
        env:
          GH_PAGES_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/publish-gh-pages.sh publish/site

      # 新網址：frank-invest 這個 org 底下沒有帳號原名，訪客看不到 qwe953751。
      # FRANK_INVEST_PAT 是個人 PAT（跟本機 gh CLI 用同一組），因為這個 repo
      # 屬於另一個 org，GITHUB_TOKEN 天生跨不過去。
      # GH_PAGES_ADMIN_SUBDIR=admin888：最高權限改發到子路徑
      # https://frank-invest.github.io/admin888/，網域根目錄（https://frank-invest.github.io/）
      # 只留空白頁，跟舊網址一樣看不到內容；檢視權限維持獨立、好記的
      # https://frank-invest.github.io/viewer/（跟 admin888/ 平級，不是巢狀在它
      # 底下），進來會轉址到 admin888/?access=viewer。
      - name: 發佈到 frank-invest.github.io（新網址，最高權限在 admin888/）
        if: ${{ !cancelled() }}
        env:
          GH_PAGES_REMOTE: https://x-access-token:${{ secrets.FRANK_INVEST_PAT }}@github.com/frank-invest/frank-invest.github.io.git
          GH_PAGES_ADMIN_SUBDIR: admin888
        run: scripts/publish-gh-pages.sh publish/site

      # 心跳的用途是回答「到底有沒有跑」，所以前面炸掉了也要記，用 always()。
      # publish-only 不碰 Supabase 與 data 狀態，不能在這裡要求尚未套用的 migration。
      - name: 心跳與狀態
        if: ${{ always() && inputs.publish-only != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          dotnet run -c Release --project src/Invest.Web -- status \
              "github-actions" "$GITHUB_WORKSPACE/data/STATUS.md"

      - name: 保存備份與狀態
        if: ${{ always() && inputs.publish-only != true }}
        working-directory: data
        run: |
          git add -A snapshots STATUS.md

          if git diff --cached --quiet; then
              echo "備份與狀態都沒有變化。"
              exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "備份與狀態 $(date +%Y-%m-%d)"
          git push -q

      # 網站上那個鈴鐺。放在最後、而且用 always()，因為它要回答的是
      # 「這一輪整體有沒有成功」——前面任何一步紅了都算沒成功。
      # 訊息寫進 Supabase 而不是快照，正是因為最該通知的情況就是發佈失敗：
      # 那時候線上的 manifest 還是舊的，寫進快照裡的字永遠送不出去。
      #
      # 這一步不能排除 publish-only：發現過 publish-only 成功發佈之後，
      # 前一輪失敗留下的警報因為這一步被跳過而永遠卡在「未恢復」，
      # 明明網站已經是最新的，鈴鐺卻一直顯示壞掉。
      - name: 更新網站上的警報
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ '${{ job.status }}' = 'success' ]; then
              dotnet run -c Release --project src/Invest.Web -- alert-clear "每日排行快照"
          else
              dotnet run -c Release --project src/Invest.Web -- alert "每日排行快照" error \
                  "這一輪有步驟失敗，網站上的排行可能還停在前一個交易日。" "$RUN_URL"
          fi

      - name: 失敗時留下線索
        if: failure()
        run: |
          {
              echo "## 這輪有步驟失敗"
              echo
              echo "先看上面哪一步是紅的。常見狀況："
              echo
              echo "- **回補行情**：官方網站擋或改格式。重跑通常就好。"
              echo "- **同步／對帳／心跳**：Supabase 被暫停或密碼變了。"
              echo "- **對帳不符**：以 \`data/imports\` 為準，先刪掉資料庫那幾天再同步。"
              echo
              echo "行情快取與靜態網站是分開推的，前面失敗不代表後面沒更新，"
              echo "實際狀態看 \`data\` 分支的 STATUS.md。"
          } >> "$GITHUB_STEP_SUMMARY"
