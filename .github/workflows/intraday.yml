# 盤中每 2 分鐘抓一輪報價寫進 Supabase，整個交易時段跑同一個 job。
# 輪距定義在 CollectionSchedule，改那邊不必動這裡，但這行的數字要跟著改。
#
# 公開 repo 的 Actions 不計費，所以一天佔著 runner 六個多小時是可以接受的。
# 盤中資料**不做備份也不救**：它每天重來，隔天盤後資料一到齊就會被 sync 刪掉。

name: 盤中報價收集

on:
  schedule:
    # 台北時間 07:33（= UTC 週日到週四 23:33），開盤前一個半小時卡住 runner。
    #
    # **不能再更早。** GitHub 對單一 job 有六小時硬上限，時間到直接 cancel，
    # timeout-minutes 設多大都沒用。原本排 07:03、實際 07:30 開跑，
    # 六小時就落在 13:30～13:34——正好把收盤那幾分鐘吃掉，
    # 08-19、08-20、08-21 連三天都是 6:00:19 然後 cancelled，收盤那一輪從來沒收到。
    # 排 07:33、實際約 08:00 開跑，上限落在 14:00，13:35 收工才來得及。
    #
    # 另一邊的風險是誤點：排程是盡力而為，實測誤點 28～31 分鐘、最糟 88 分鐘。
    # 07:33 就算誤點 87 分鐘也還在 09:00 開盤前開跑，兩頭都留得住。
    # 分鐘避開整點與半點，那是所有人排程的尖峰、誤點最嚴重。
    #
    # 提早開跑不會寫進盤前髒資料：MIS 在開盤前給的是上一個交易日，收集器認得出來。
    # 收工時間定義在 CollectionSchedule（前端也讀同一份），cron 讀不到，改那邊要順手看這裡。
    - cron: '33 23 * * 0-4'
  workflow_dispatch:

# 上一場還沒收工就不要再開一場，否則同一個時間點會寫進兩輪。
#
# 排程跟手動觸發各自一組：兩者共用同一組的話，交易時段中手動點一次
# workflow_dispatch 來測新功能，就得先把正在跑的排程那場手動取消才擠得進去
# ——08/24 就是這樣把當天唯一一場自動收集攔腰砍斷，族群盤中熱度整天只有一輪資料。
# 分開組別後，手動測試最多跟自己排隊，不會動到當天唯一一場自動收集。
concurrency:
  group: intraday-${{ github.event_name }}

jobs:
  collect:
    runs-on: ubuntu-latest
    # 07:03 開始跑到 13:35 收工是六個半小時，留一點餘裕。
    timeout-minutes: 420

    env:
      TZ: Asia/Taipei
      INTRADAY_SOURCE: github-actions

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      # 廣度要比較個股前收、量能要比較最近 20 個交易日；兩者都在 data/imports。
      # 少了這份快取時，收集器仍能寫入即時指數，卻只能得到短期趨勢分數。
      - name: 取出盤後歷史快取
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 1

      # 只是先看一眼這台 runner 通不通，方便事後看日誌時對照。
      # 連不上也照跑：開盤前兩小時的一次連線失敗不能代表整天，
      # 收集器本來就會每 2 分鐘重試到 13:35，真的整場都沒收到才會紅。
      - name: 探一下 MIS
        continue-on-error: true
        run: |
          body=$(curl -sS --max-time 30 \
              -H 'User-Agent: Mozilla/5.0' \
              -H 'Referer: https://mis.twse.com.tw/stock/index.jsp' \
              'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw&json=1&delay=0')

          echo "$body" | head -c 400
          echo

          if echo "$body" | grep -q '"rtcode":"0000"'; then
              echo "MIS 正常回應。"
          else
              echo "::warning::MIS 這一下沒有正常回應，收集器會繼續重試到收盤。"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 收集器自己撐到 13:35。整場一輪都沒寫進去、而且中間出過錯，它會丟例外讓這一步紅掉；
      # 整場都問得到 MIS、只是日期一直停在上一個交易日，才算休市、正常結束。
      - name: 收集盤中報價
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: dotnet run -c Release --project src/Invest.Web -- intraday --loop

      # 網站上那個鈴鐺。休市會正常結束、不會走到這裡的 else，
      # 所以颱風假不會每次都在畫面上留一個紅點。
      - name: 更新網站上的警報
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ '${{ job.status }}' = 'success' ]; then
              dotnet run -c Release --project src/Invest.Web -- alert-clear "盤中報價收集"
          else
              dotnet run -c Release --project src/Invest.Web -- alert "盤中報價收集" error \
                  "盤中收集這一場沒有正常收工，盤中頁的數字可能停在中途。" "$RUN_URL"
          fi
