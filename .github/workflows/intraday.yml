# 盤中每 2 分鐘抓一輪報價寫進 Supabase。
#
# ## 為什麼是「自走鏈」而不是排程
#
# 2026-08-27、08-28 連兩天，GitHub 的 schedule 事件晚到 6～13 小時，或整天沒送達。
# 8/28 三個盤中 cron（台北 07:33／08:17／09:01）分別在 15:01、19:22、20:30 才進 runner，
# 全部落在收盤後；同一天 18:00 的每日快照連同兩個備援也完全沒來。結果就是
# 「開盤了，網站還停在昨天」，只能靠人手動補跑。
#
# 加更多 cron 沒有用——那天三個 cron 全都晚到，不是其中一個漏掉。
#
# 所以不再依賴 GitHub 的鬧鐘。實測（run 33177347324 → 33177357163 → 33177365236）確認
# **GITHUB_TOKEN 可以觸發 workflow_dispatch**：文件把 workflow_dispatch 與
# repository_dispatch 列為遞迴保護的例外，「always create workflow runs」。
# 於是這支 workflow 自己接力：每一棒開跑就先把下一棒叫起來排隊，自己睡到下一次開盤
# （或睡到本棒的時間用完為止），時間到就收集。鏈子自己走，不需要任何外部裝置或金鑰。
#
# 代價講清楚：這等於長期佔著一個 runner。公開 repo 的 Actions 不計費，
# 併發上限 20 個 job 我們只用 1 個，所以可以接受；換來的是「開盤一定有人在」。
#
# ## 鏈子斷了怎麼辦
#
# 唯一會斷鏈的情況是「叫下一棒」那一步連 API 都打不到，或整個 run 根本沒被建立。
# 底下仍保留 cron，但它的角色從「主要啟動方式」降級成**復原**：只要有任何一個
# 事件在任何時間點送達，就會重新長出一條鏈。晚到多久都沒關係，因為新的一棒會自己
# 算出下一次開盤是什麼時候再睡過去——晚到的事件不再被丟掉。
#
# 週末也排一次，因為週五盤後到週一開盤中間如果斷鏈，沒有平日的 cron 可以接。

name: 盤中報價收集

on:
  workflow_dispatch:
    inputs:
      hop:
        description: 這是接力的第幾棒（自走鏈自己填，手動觸發不必理）
        default: '0'

  schedule:
    # 只是復原用的火種，不是主要啟動方式。分鐘避開整點與半點（排程尖峰）。
    - cron: '33 23 * * 0-4'
    - cron: '17 0 * * 1-5'
    - cron: '1 1 * * 1-5'
    - cron: '23 14 * * *'

permissions:
  # 叫下一棒要 actions: write。這是整條鏈的關鍵權限。
  actions: write
  contents: read

# 同一時間只准一棒在跑，否則同一個時間點會寫進兩輪。
#
# 這裡刻意讓排程與手動觸發共用同一組——舊版把兩者分開，是為了避免手動測試被排程卡住；
# 現在自走鏈本身就是 workflow_dispatch，分開就等於允許兩個收集器並行寫入，那是資料錯誤。
#
# 想立刻重跑一輪時不要另外觸發（會排到 5 個多小時後），直接把正在睡的那一棒 cancel 掉：
# 它開跑時已經先把下一棒排在後面，cancel 之後下一棒馬上頂上、重新判斷現在該不該收集。
concurrency:
  group: intraday-daemon
  cancel-in-progress: false

jobs:
  hop:
    runs-on: ubuntu-latest
    # 單一 job 的硬上限是 6 小時，時間到直接 cancel，timeout-minutes 設多大都沒用。
    # 底下的 HOP_BUDGET 只給 5 小時 30 分，這裡再留 20 分鐘讓收尾步驟跑完。
    timeout-minutes: 350

    env:
      TZ: Asia/Taipei
      INTRADAY_SOURCE: github-actions

      # 提早 20 分鐘開跑：checkout、setup-dotnet、還原套件要幾分鐘，
      # 要讓第一輪快照落在 09:00 而不是 09:05。
      SESSION_OPEN: '0840'
      # 收工時間的權威定義在 CollectionSchedule（前端讀同一份），這裡只用來判斷
      # 「現在還算不算盤中」，改那邊要順手看這裡。
      SESSION_CLOSE: '1335'

      # 一棒最多佔 5 小時 30 分，離 6 小時硬上限留 30 分鐘。
      HOP_BUDGET_SECONDS: '19800'
      # 08:40 開跑到 13:35 收工是 4 小時 55 分。剩餘時間不到這個數就不接收集的工作，
      # 直接交棒——下一棒是全新的 6 小時，反而收得完整。
      COLLECT_NEEDS_SECONDS: '17700'
      # 撐不到整場的那一棒要提早幾秒退場，把暖機時間讓給下一棒。
      # 10 分鐘足夠讓排隊的下一棒拿到 runner 並跑完 checkout 與 setup-dotnet。
      HANDOFF_LEAD_SECONDS: '600'

    steps:
      # ── 第一件事就是把下一棒排進隊伍 ────────────────────────────────
      #
      # 放在最前面而不是最後：這一棒可能被 6 小時上限砍掉、可能 runner 掛掉、
      # 可能中途被 cancel，那些情況都輪不到「最後一步」執行。先叫好放著排隊，
      # 不論這一棒怎麼結束，併發鎖一放開下一棒就頂上。
      #
      # 排隊中的那一棒不會平行執行：concurrency 保證同組同時只有一個在跑，
      # 而且新的 pending 會取代舊的 pending，所以永遠只有一棒在等，不會愈叫愈多。
      - name: 先叫下一棒來排隊
        env:
          GH_TOKEN: ${{ github.token }}
          HOP: ${{ inputs.hop || '0' }}
        run: |
          # 每個 step 是獨立的 shell，$SECONDS 會重來，所以把開跑時間留在檔案裡，
          # 最後一步的防暴衝要拿它算整棒活了多久。
          date +%s > "$RUNNER_TEMP/hop-started-at"

          next=$(( ${HOP:-0} + 1 ))
          echo "我是第 ${HOP:-0} 棒（$GITHUB_EVENT_NAME），先把第 $next 棒排進隊伍。"

          for attempt in 1 2 3; do
              if gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/intraday.yml/dispatches" \
                  -f ref=main -f "inputs[hop]=$next"; then
                  echo "第 $next 棒已排隊。"
                  exit 0
              fi
              echo "::warning::第 $attempt 次叫下一棒失敗，10 秒後重試。"
              sleep 10
          done

          # 三次都失敗就讓這一步紅掉，鈴鐺會亮；cron 火種還在，之後仍會重新長出鏈子。
          echo "::error::叫不到下一棒，自走鏈可能中斷，等 cron 復原。"
          exit 1

      - name: 取出原始碼
        uses: actions/checkout@v4

      # ── 睡到下一次開盤（或睡到本棒時間用完）────────────────────────
      #
      # 順便當整個 repo 的鬧鐘：醒著的時候每 5 分鐘看一眼，過了 18:00 而今天還沒有
      # 成功的每日快照，就把它叫起來。每日快照原本也只靠 cron，8/28 同樣整天沒送達。
      - name: 等到開盤
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Actions 預設的 shell 是 `bash -e`，errexit 是命令列給的，寫 set -uo pipefail
          # 不會把它關掉。這裡明確關掉：底下大量用「條件不成立就 return」的寫法，
          # 那種 return 會帶著狀態 1 回來，在 errexit 下會直接把整個步驟打掉。
          set +e
          set -uo pipefail

          started=$(date +%s)
          deadline=$(( started + HOP_BUDGET_SECONDS ))

          in_session() {
              local d h
              d=$(date +%u)
              h=$(date +%H%M)
              [ "$d" -le 5 ] && [ "$h" -ge "$SESSION_OPEN" ] && [ "$h" -lt "$SESSION_CLOSE" ]
          }

          # 下一次開盤的 epoch。往後找一週，跳過週六日。
          #
          # 刻意先取日期再組成完整字串（"2026-08-31 08:40:00"），不要寫成
          # date -d "+1 day 08:40"：那是「相對日 + 絕對時刻」的混合式，
          # 解析結果得看 GNU date 的心情，而整條鏈都押在這個值上。
          next_open() {
              local now i day cand dow
              now=$(date +%s)
              for i in 0 1 2 3 4 5 6 7; do
                  dow=$(date -d "+$i day" +%u)
                  [ "$dow" -le 5 ] || continue
                  day=$(date -d "+$i day" +%F)
                  cand=$(date -d "$day ${SESSION_OPEN:0:2}:${SESSION_OPEN:2:2}:00" +%s)
                  if [ "$cand" -gt "$now" ]; then
                      echo "$cand"
                      return 0
                  fi
              done
              # 找不到就回空字串，交給呼叫端的守衛處理。狀態一律給 0，
              # 別讓「沒找到」以非零狀態傳出去。
              return 0
          }

          # 今天過了 18:00 而每日快照還沒成功，就把它叫起來。一棒最多叫一次。
          snapshot_kicked=0
          maybe_kick_snapshot() {
              # 這些 return 一律帶 0：這個函式是在 while 迴圈裡裸呼叫的，
              # 「現在不必叫快照」是正常結果，不是錯誤。
              [ "$snapshot_kicked" -eq 0 ] || return 0
              local d h since run_id
              d=$(date +%u); h=$(date +%H%M)
              [ "$d" -le 5 ] || return 0
              [ "$h" -ge 1800 ] && [ "$h" -lt 2200 ] || return 0

              # 「今天」是台北的今天；API 回的是 UTC，所以拿台北 00:00 換算成 UTC 當分界線。
              # date -u 會連輸入字串一起當成 UTC 解讀，所以先在本地時區算出 epoch 再轉。
              since=$(date -u -d "@$(date -d "$(date +%F) 00:00:00" +%s)" +%Y-%m-%dT%H:%M:%SZ)

              # 只認「真的把今天行情收回來」的那種 run。
              #
              # 2026-08-31 就是栽在這裡：當天 GitHub 的 cron 一發都沒送到，本來全靠這個
              # 鬧鐘補位，但白天有人手動用 publish-only 重發過幾次網站。publish-only 會
              # 跳過「回補行情」，只重跑輸出與發布，run 的 conclusion 一樣是 success。
              # 舊寫法只看 conclusion，於是 18:00:30 判定「今天已經有成功的每日快照」而
              # 不叫，整天的盤後資料就沒人收——data 分支停在 08-28，網站也停在 08-28。
              #
              # 所以改成逐一翻開當天的 run，確認裡面「回補行情」這一步真的成功過。
              # 步驟名稱是跟 daily-snapshot.yml 對齊的約定，改那邊要順手改這裡
              # （已用單元測試釘住）。
              for run_id in $(gh api \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/daily-snapshot.yml/runs?per_page=30" \
                  --jq "[.workflow_runs[]
                         | select(.updated_at > \"$since\")
                         | .id] | .[]" 2>/dev/null); do
                  if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                      --jq '.jobs[].steps[]? | select(.name == "回補行情" and .conclusion == "success") | .name' \
                      2>/dev/null | grep -q .; then
                      echo "今天的 run $run_id 已經回補過行情，不重複叫。"
                      snapshot_kicked=1
                      return 0
                  fi
              done

              echo "台北 $(date '+%F %T')：過了 18:00 但今天還沒有成功的每日快照，叫它起來。"
              if gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/daily-snapshot.yml/dispatches" \
                  -f ref=main; then
                  snapshot_kicked=1
              else
                  echo "::warning::叫每日快照失敗，下一輪再試。"
              fi
              return 0
          }

          if in_session; then
              echo "台北 $(date '+%F %T')，現在就在盤中，直接開始收集。"
              echo "collect=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          target=$(next_open)
          if [ -z "$target" ]; then
              # 算不出下一次開盤代表 date 的行為跟預期不一樣。不要用壞掉的數字去做運算，
              # 直接把這一棒結束掉——下一棒已經排好了，鏈子不會斷。
              echo "::error::算不出下一次開盤時間，這一棒放棄，交給下一棒。"
              echo "collect=false" >> "$GITHUB_OUTPUT"
              exit 1
          fi

          echo "台北 $(date '+%F %T')；下一次開盤 $(date -d "@$target" '+%F %T')。"
          echo "本棒最多撐到 $(date -d "@$deadline" '+%F %T')。"

          # 現在就決定這一棒的身分，不要睡到開盤才決定：
          #
          #   撐得到 → 睡到開盤，然後自己收集。
          #   撐不到 → 這一棒只是個佔位的，任務是「在對的時間退場」，讓下一棒接手。
          #
          # 撐不到的那一棒刻意提早 HANDOFF_LEAD_SECONDS 退場，而不是撐到開盤才退。
          # 差別很大：排隊中的下一棒要等併發鎖放開、等 runner 配下來，接著還要
          # checkout、setup-dotnet、還原套件。如果前一棒是踩著開盤時間才退場，
          # 這些都得在開盤後才發生，第一輪快照就會遲到。提早退場等於把暖機時間
          # 讓給下一棒，而下一棒起跑時預算還有 5 小時 20 分，收整場綽綽有餘。
          if [ $(( deadline - target )) -ge "$COLLECT_NEEDS_SECONDS" ]; then
              retire=$target
              role=collector
              echo "本棒在開盤時還有 $(( (deadline - target) / 60 )) 分鐘，夠收完整場：這一棒自己收。"
          else
              retire=$(( target - HANDOFF_LEAD_SECONDS ))
              [ "$deadline" -lt "$retire" ] && retire=$deadline
              role=placeholder
              echo "本棒在開盤時只剩 $(( (deadline - target) / 60 )) 分鐘，收不完整場。"
              echo "改當佔位棒，$(date -d "@$retire" '+%F %T') 退場讓下一棒提早暖機。"
          fi

          # 每 5 分鐘醒一次，而不是一覺睡到底：這樣才有機會順手叫每日快照，
          # 也才看得出這一棒還活著（日誌每 5 分鐘會多一行）。
          while :; do
              now=$(date +%s)

              if [ "$now" -ge "$retire" ]; then
                  if [ "$role" = collector ]; then
                      echo "開盤了，開始收集。"
                      echo "collect=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "佔位棒退場，交給下一棒。"
                      echo "collect=false" >> "$GITHUB_OUTPUT"
                  fi
                  exit 0
              fi

              maybe_kick_snapshot

              # 睡到「下一次該醒來」為止：退場時間或 5 分鐘後，取近的那個。
              wake=$(( now + 300 ))
              [ "$retire" -lt "$wake" ] && wake=$retire
              sleep $(( wake - now ))
          done

      # ── 以下只有輪到收集的那一棒才會做 ──────────────────────────────

      # 廣度要比較個股前收、量能要比較最近 20 個交易日；兩者都在 data/imports。
      # 少了這份快取時，收集器仍能寫入即時指數，卻只能得到短期趨勢分數。
      - name: 取出盤後歷史快取
        if: steps.wait.outputs.collect == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 1

      # 只是先看一眼這台 runner 通不通，方便事後看日誌時對照。
      # 連不上也照跑：開盤前的一次連線失敗不能代表整天，
      # 收集器本來就會每 2 分鐘重試到 13:35，真的整場都沒收到才會紅。
      - name: 探一下 MIS
        if: steps.wait.outputs.collect == 'true'
        continue-on-error: true
        run: |
          body=$(curl -sS --max-time 30 \
              -H 'User-Agent: Mozilla/5.0' \
              -H 'Referer: https://mis.twse.com.tw/stock/index.jsp' \
              'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw&json=1&delay=0')

          echo "$body" | head -c 400
          echo

          if echo "$body" | grep -q '"rtcode":"0000"'; then
              echo "MIS 正常回應。"
          else
              echo "::warning::MIS 這一下沒有正常回應，收集器會繼續重試到收盤。"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.wait.outputs.collect == 'true'
        with:
          dotnet-version: '10.0.x'

      # 收集器自己撐到 13:35。整場一輪都沒寫進去、而且中間出過錯，它會丟例外讓這一步紅掉；
      # 整場都問得到 MIS、只是日期一直停在上一個交易日，才算休市、正常結束。
      - name: 收集盤中報價
        if: steps.wait.outputs.collect == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # 只在 runner 上用於上傳公開盤中快照；不可放入 manifest、網站 JS 或 log。
          SUPABASE_STORAGE_SECRET_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_KEY }}
        run: dotnet run -c Release --project src/Invest.Web -- intraday --loop

      # 網站上那個鈴鐺。休市會正常結束、不會走到這裡的 else，
      # 所以颱風假不會每次都在畫面上留一個紅點。
      - name: 更新網站上的警報
        if: always() && steps.wait.outputs.collect == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ '${{ job.status }}' = 'success' ]; then
              dotnet run -c Release --project src/Invest.Web -- alert-clear "盤中報價收集"
          else
              dotnet run -c Release --project src/Invest.Web -- alert "盤中報價收集" error \
                  "盤中收集這一場沒有正常收工，盤中頁的數字可能停在中途。" "$RUN_URL"
          fi

      # ── 防暴衝 ────────────────────────────────────────────────────
      #
      # 自走鏈最危險的失敗模式是「每一棒都在幾秒內失敗」——那會變成一分鐘好幾棒，
      # 一天上千個 run。這裡保證每一棒至少活 3 分鐘，最壞情況也只會是一小時 20 棒，
      # 留得下時間讓人看到鈴鐺並把 workflow 停掉。
      - name: 保底停留
        if: always()
        run: |
          floor=180
          started=$(cat "$RUNNER_TEMP/hop-started-at" 2>/dev/null || echo 0)
          if [ "$started" -eq 0 ]; then
              echo "沒讀到開跑時間，直接補睡 $floor 秒。"
              sleep "$floor"
              exit 0
          fi

          spent=$(( $(date +%s) - started ))
          if [ "$spent" -lt "$floor" ]; then
              echo "這一棒只花了 $spent 秒，補睡 $(( floor - spent )) 秒，避免鏈子空轉暴衝。"
              sleep $(( floor - spent ))
          else
              echo "這一棒活了 $spent 秒，不必補睡。"
          fi

  # ── 讓 CDN 在當天就生效，而不是等當天 18:00 ────────────────────────────
  #
  # 盤中資料改走 Supabase Storage 的公開 CDN 之後，瀏覽器要不要走那條路，是看
  # manifest.json 裡有沒有 intradayCdn。而 manifest 只有在「輸出靜態網站」時才會重寫。
  #
  # 這中間有一個空窗：第一次上線（或 bucket 曾經空掉）時，manifest 還停在「沒有 CDN」，
  # 要等當天 18:00 的每日快照才會換上去——等於整個交易日都還在燒舊路徑的流量。
  #
  # 這個工作專門補這個空窗：跟收集器平行跑，等到 CDN 上真的抓得到 latest.json，
  # 就立刻叫每日快照用 publish-only 重發一次網站。
  #
  # 為什麼不無條件重發：線上 manifest 已經宣告 CDN 就直接收工，所以正常日子它只花
  # 一次 HTTP 請求。只有「還沒上線」或「上線後又掉回去」時才會真的動作，至多一次。
  # 這也順便是一道自我修復——匯出時 bucket 剛好是空的而把 CDN 關掉的話，
  # 下一棒會自己把它補開回來。
  publish-manifest:
    runs-on: ubuntu-latest
    # 跟著本棒一起活。不能只等一兩小時就收工：一棒可能在凌晨三點多就開跑、睡到 08:40
    # 才開盤，短命的等待會在開盤前就放棄，那就永遠等不到第一次上傳。
    timeout-minutes: 340

    permissions:
      actions: write
      contents: read

    env:
      SITE_MANIFEST_URL: https://frank-invest.github.io/manifest.json
      CDN_LATEST_URL: https://dehzxlxyfvtnylwgbmqy.supabase.co/storage/v1/object/public/intraday-snapshots/latest.json
      # 和 HOP_BUDGET 一樣是 5 小時 30 分：這一棒還在，就一直看著。
      WAIT_SECONDS: '19800'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── 先診斷：現在到底走哪一條路 ───────────────────────────────────
      #
      # 只有兩個判斷，而且都跟時間無關（latest.json 永遠不清理，所以半夜、週末
      # 抓不到都是真的壞了，不會誤報）：
      #   1. 線上 manifest 有沒有宣告 intradayCdn？沒有 → 前端整天走資料庫直連。
      #   2. CDN 抓不抓得到 latest.json、以及它指到的那份完整快照？
      #      抓不到 → 前端會退回資料庫直連。
      #
      # 兩種情況的後果都一樣：流量從便宜的 cached egress 掉回貴的 database egress。
      # 這正是 8 月把 Free Plan 額度燒到 130% 的原因，所以必須有人看著。
      - name: 診斷盤中 CDN 現在健不健康
        id: probe
        run: |
          set +e
          set -uo pipefail

          state=healthy
          detail=""

          manifest=$(curl -fsSL --max-time 30 "$SITE_MANIFEST_URL" 2>/dev/null)

          if [ -z "$manifest" ]; then
              state=unknown
              detail="讀不到線上 manifest（$SITE_MANIFEST_URL）。"
          elif ! printf '%s' "$manifest" | grep -q '"intradayCdn"'; then
              state=manifest-missing-cdn
              detail="線上 manifest 沒有宣告 intradayCdn，前端只能走資料庫直連。"
          fi

          # manifest 說要走 CDN 的話，就要確認 CDN 真的給得出東西。
          if [ "$state" = "healthy" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$CDN_LATEST_URL")

              if [ "$code" != "200" ]; then
                  state=cdn-broken
                  detail="manifest 宣告了 CDN，但 latest.json 抓不到（HTTP $code）。"
              else
                  # latest.json 在，不代表它指到的那份完整快照還在：
                  # 清理只保留最近 30 份，指標卻永不刪除。
                  file=$(curl -fsSL --max-time 30 "$CDN_LATEST_URL" 2>/dev/null \
                      | sed -n 's/.*"file"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')

                  if [ -z "$file" ]; then
                      state=cdn-broken
                      detail="latest.json 讀得到但解不出 file 欄位，指標格式可能壞了。"
                  else
                      snapshot_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                          "${CDN_LATEST_URL%/latest.json}/$file")

                      if [ "$snapshot_code" != "200" ]; then
                          state=cdn-broken
                          detail="latest.json 指到 $file，但那份快照抓不到（HTTP $snapshot_code）。"
                      fi
                  fi
              fi
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "診斷結果：$state ${detail:-（一切正常）}"

      - name: 等 CDN 有快照就把 manifest 換成走 CDN
        id: republish
        if: steps.probe.outputs.state == 'manifest-missing-cdn' || steps.probe.outputs.state == 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # runner 的預設 shell 是 bash -e，errexit 從命令列來、腳本內的 set 關不掉。
          # 底下每個判斷都可能「不成立」，那不是錯誤，所以先明確關掉。
          set +e
          set -uo pipefail

          echo "manifest 還沒切到 CDN，等 CDN 出現快照後重發網站。"

          # 這一棒的 hop 收工了沒。concurrency 是「整個 run」層級的鎖，只要這個 job
          # 還在跑，run 就還算 in_progress，排隊中的下一棒就進不來。
          #
          # 2026-08-31 就是這樣卡住的：hop 在 08:30 判斷自己撐不完整場、提早交棒收工，
          # 但這個 job 還要再等 CDN 五個半小時，於是下一棒從 08:30 一路 pending 到
          # 10 點多，開盤後一個多小時完全沒有人在收集。
          #
          # 這個 job 的定位本來就是「跟著本棒一起活」，hop 死了它就沒有理由繼續佔著鎖。
          hop_done() {
              local status
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                  --jq '[.jobs[] | select(.name == "hop") | .status] | first' 2>/dev/null)

              # 查不到就當作還活著：查詢失敗是暫時性的，不該讓它提早放棄等 CDN。
              [ "$status" = "completed" ]
          }

          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          found=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$CDN_LATEST_URL")

              if [ "$code" = "200" ]; then
                  echo "$(date '+%H:%M:%S') CDN 上已經有 latest.json。"
                  found=1
                  break
              fi

              if hop_done; then
                  echo "$(date '+%H:%M:%S') 本棒的 hop 已經收工，不再佔著 concurrency 鎖，讓下一棒進來。"
                  break
              fi

              echo "$(date '+%H:%M:%S') CDN 還沒有 latest.json（HTTP $code），5 分鐘後再看。"
              sleep 300
          done

          if [ "$found" -ne 1 ]; then
              # 沒開盤的日子本來就不會有人上傳，這不是異常。
              echo "整棒都沒看到 CDN 快照（今天多半沒開盤或收集器沒上傳），不重發網站。"
              echo "dispatched=idle" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # 只重發畫面，不動 data 分支、不等今日行情，所以跟收集器並行沒有衝突。
          # 匯出端自己也會再確認一次 CDN 抓不抓得到，抓不到就不會宣告——
          # 這裡即使誤判，最壞情況也只是白跑一次發布。
          for attempt in 1 2 3; do
              if gh workflow run daily-snapshot.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f publish-only=true; then
                  echo "已請每日快照重發網站，manifest 會換成走 CDN。"
                  echo "dispatched=ok" >> "$GITHUB_OUTPUT"
                  exit 0
              fi

              echo "::warning::第 $attempt 次觸發重發失敗，10 秒後重試。"
              sleep 10
          done

          echo "::error::連續三次都叫不動每日快照，manifest 今天不會切到 CDN。"
          echo "dispatched=failed" >> "$GITHUB_OUTPUT"
          exit 1

      # ── 留下紀錄 ────────────────────────────────────────────────────
      #
      # 退回資料庫直連是「保住畫面」的正確行為，但它同時也是「流量開始變貴」。
      # 沒人看著的話就會默默一路燒到下個月帳單——8 月就是這樣燒到 130% 的。
      #
      # 所以這裡把結果同時寫到三個地方，讓下一個接手的人（或 AI agent）不必靠記憶：
      #   1. 網站上的鈴鐺（site_alerts）——你自己看得到，而且 anon 可讀，查得到。
      #   2. Actions 的 job summary 與 ::error:: 標註——從 GitHub 這一側看得到。
      #   3. 同一個 source 只會有一則未解除的警報，恢復了會自動收掉。
      - name: 記錄診斷結果
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.probe.outputs.state }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          DISPATCHED: ${{ steps.republish.outputs.dispatched }}
        run: |
          set +e
          set -uo pipefail

          alert() {
              dotnet run -c Release --project src/Invest.Web -- alert "盤中 CDN" "$1" "$2" "$RUN_URL"
          }

          case "$STATE" in
              healthy)
                  echo "### 盤中 CDN 正常" >> "$GITHUB_STEP_SUMMARY"
                  echo "manifest 有宣告 CDN，latest.json 與它指到的快照都抓得到。" >> "$GITHUB_STEP_SUMMARY"
                  dotnet run -c Release --project src/Invest.Web -- alert-clear "盤中 CDN"
                  ;;

              cdn-broken)
                  echo "::error::盤中 CDN 壞了：$DETAIL 前端已經退回資料庫直連，流量會開始變貴。"
                  {
                      echo "### ⚠️ 盤中 CDN 壞了，流量正在變貴"
                      echo
                      echo "$DETAIL"
                      echo
                      echo "前端會自動退回 Supabase 直連，畫面不會壞，**但流量會從便宜的"
                      echo "cached egress 掉回貴的 database egress**。放著不管會重演 8 月燒到 130% 的狀況。"
                      echo
                      echo "怎麼查：看 \`intraday\` workflow 裡「收集盤中報價」那一步有沒有上傳失敗的訊息；"
                      echo "再確認 \`SUPABASE_STORAGE_SECRET_KEY\` 還有效、bucket \`intraday-snapshots\` 還在。"
                      echo "細節見 \`Doc/技術文件/Supabase多裝置流量節流與盤中CDN決策.md\`。"
                  } >> "$GITHUB_STEP_SUMMARY"
                  alert error "盤中 CDN 讀不到，網站已退回資料庫直連——流量會變貴，要盡快查。"
                  ;;

              manifest-missing-cdn|unknown)
                  if [ "${DISPATCHED:-}" = "ok" ]; then
                      echo "### 盤中 CDN 剛剛切上去了" >> "$GITHUB_STEP_SUMMARY"
                      echo "已請每日快照重發網站，下次診斷應該就會是 healthy。" >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  if [ "${DISPATCHED:-}" = "idle" ]; then
                      # 沒開盤的日子不該留警報，否則週末天天紅點。
                      echo "### 今天沒看到 CDN 快照" >> "$GITHUB_STEP_SUMMARY"
                      echo "多半是沒開盤。不視為異常。" >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  echo "::error::manifest 沒有宣告盤中 CDN，而且沒能重發網站：$DETAIL"
                  {
                      echo "### ⚠️ 網站還在走資料庫直連"
                      echo
                      echo "$DETAIL"
                      echo
                      echo "每台裝置每 2 分鐘各拉一次全市場資料，這是 8 月把 Free Plan"
                      echo "額度燒到 130% 的原因。**2026-09-27 起 Fair Use Policy 生效，"
                      echo "要壓到 5.5 GB 以下。**"
                  } >> "$GITHUB_STEP_SUMMARY"
                  alert error "網站還在走資料庫直連，沒切到盤中 CDN——流量會超標，要盡快查。"
                  ;;
          esac

          # 通知寫不進去是小事，因為這一步失敗而把整個工作標紅、蓋掉前面真正的診斷
          # 才是大事。這跟 alert CLI 自己「連不上資料庫只印訊息不丟例外」是同一個約定。
          exit 0
