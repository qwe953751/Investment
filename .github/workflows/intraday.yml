# 盤中每 5 分鐘抓一輪報價寫進 Supabase，整個交易時段跑同一個 job。
#
# 公開 repo 的 Actions 不計費，所以一天佔著 runner 四個半小時是可以接受的。
# 盤中資料**不做備份也不救**：它每天重來，隔天盤後資料一到齊就會被 sync 刪掉。

name: 盤中報價收集

on:
  schedule:
    # 台北時間 08:40，開盤前二十分鐘就先卡住 runner。
    # GitHub 的排程尖峰時段常誤點十幾分鐘，抓 09:00 有機會錯過開盤那一段。
    - cron: '40 0 * * 1-5'
  workflow_dispatch:

# 上一場還沒收工就不要再開一場，否則同一個時間點會寫進兩輪。
concurrency:
  group: intraday

jobs:
  collect:
    runs-on: ubuntu-latest
    # 08:40 開始跑到 13:35 收工是四小時五十五分，留一點餘裕。
    timeout-minutes: 320

    env:
      TZ: Asia/Taipei
      INTRADAY_SOURCE: github-actions

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      # 先確認 runner 連得到證交所。連不到的話整場都是白跑的，
      # 與其等四個半小時後才發現，不如在這裡就停。
      - name: 確認連得到 MIS
        run: |
          body=$(curl -sS --max-time 30 \
              -H 'User-Agent: Mozilla/5.0' \
              -H 'Referer: https://mis.twse.com.tw/stock/index.jsp' \
              'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw&json=1&delay=0')

          echo "$body" | head -c 400
          echo

          if ! echo "$body" | grep -q '"rtcode":"0000"'; then
              echo "MIS 沒有正常回應，這台 runner 可能被擋。" >&2
              exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 收集盤中報價
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: dotnet run -c Release --project src/Invest.Web -- intraday --loop
