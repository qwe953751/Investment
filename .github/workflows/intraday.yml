# 盤中每 5 分鐘抓一輪報價寫進 Supabase，整個交易時段跑同一個 job。
#
# 公開 repo 的 Actions 不計費，所以一天佔著 runner 六個多小時是可以接受的。
# 盤中資料**不做備份也不救**：它每天重來，隔天盤後資料一到齊就會被 sync 刪掉。

name: 盤中報價收集

on:
  schedule:
    # 台北時間 07:03（= UTC 週日到週四 23:03），開盤前兩小時就先卡住 runner。
    # GitHub 的排程是盡力而為，實測誤點過 88 分鐘，所以緩衝要抓得比誤點大。
    # 分鐘避開整點與半點，那是所有人排程的尖峰、誤點最嚴重。
    # 提早開跑不會寫進盤前髒資料：MIS 在開盤前給的是上一個交易日，收集器認得出來。
    - cron: '3 23 * * 0-4'
  workflow_dispatch:

# 上一場還沒收工就不要再開一場，否則同一個時間點會寫進兩輪。
concurrency:
  group: intraday

jobs:
  collect:
    runs-on: ubuntu-latest
    # 07:03 開始跑到 13:35 收工是六個半小時，留一點餘裕。
    timeout-minutes: 420

    env:
      TZ: Asia/Taipei
      INTRADAY_SOURCE: github-actions

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      # 只是先看一眼這台 runner 通不通，方便事後看日誌時對照。
      # 連不上也照跑：開盤前兩小時的一次連線失敗不能代表整天，
      # 收集器本來就會每 5 分鐘重試到 13:35，真的整場都沒收到才會紅。
      - name: 探一下 MIS
        continue-on-error: true
        run: |
          body=$(curl -sS --max-time 30 \
              -H 'User-Agent: Mozilla/5.0' \
              -H 'Referer: https://mis.twse.com.tw/stock/index.jsp' \
              'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw&json=1&delay=0')

          echo "$body" | head -c 400
          echo

          if echo "$body" | grep -q '"rtcode":"0000"'; then
              echo "MIS 正常回應。"
          else
              echo "::warning::MIS 這一下沒有正常回應，收集器會繼續重試到收盤。"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 收集器自己撐到 13:35。整場一輪都沒寫進去、而且中間出過錯，它會丟例外讓這一步紅掉；
      # 整場都問得到 MIS、只是日期一直停在上一個交易日，才算休市、正常結束。
      - name: 收集盤中報價
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: dotnet run -c Release --project src/Invest.Web -- intraday --loop
