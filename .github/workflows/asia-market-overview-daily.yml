# 日／韓收盤日線。這條流程更新 data/imports-overview 後，會另外 dispatch
# daily-snapshot.yml（publish-only=true）把新快取發布到公開網站；不同步 Supabase
# Database；backfill-overview 的品質門檻若未通過，指令會以非零狀態結束，下面的
# data commit 不會執行，因此不會留下半套快取，也不會觸發發布。

name: 日韓市場總覽盤後快取

on:
  schedule:
    # UTC 06:00 = 台北 14:00 排隊；GitHub schedule 實際常延遲數小時（見 TODO #13），
    # 提早排隊只是多買緩衝，內部仍會等到 17:30 才真正開始抓，不會提前抓到未公布的行情。
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      skip-wait:
        description: 跳過等待，立刻回補（診斷用）
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: asia-market-overview-daily
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Taipei

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 取出行情快取
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 等到台北 17:30
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip-wait != true }}
        run: |
          target=$(date -d '17:30' +%s)
          wait=$(( target - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
              sleep "$wait"
          fi

      - name: 回補日韓市場總覽日線
        run: dotnet run -c Release --project src/Invest.Web -- backfill-overview --markets jp,kr

      # Yahoo screener 是未公開端點、不需要金鑰；沒有 SLA，失敗就跳過這步，不擋後面的保存快取。
      - name: 回補日韓成交金額前 20
        continue-on-error: true
        run: dotnet run -c Release --project src/Invest.Web -- market-turnover --markets jp,kr

      - name: 保存日韓市場總覽快取
        id: save
        working-directory: data
        run: |
          git add -A imports-overview

          # imports-turnover 要等排行來源接線才會生出第一個檔案；目錄還不存在時
          # git add 會以 pathspec 錯誤整步中止，連帶擋掉已經回補好的總覽日線。
          if [ -d imports-turnover ]; then
              git add -A imports-turnover
          fi

          if git diff --cached --name-only --diff-filter=D | grep -q .; then
              echo "偵測到市場總覽歷史檔案被刪除，中止：" >&2
              git diff --cached --name-only --diff-filter=D >&2
              exit 1
          fi

          if git diff --cached --quiet; then
              echo "沒有新的日韓市場總覽日線。"
              echo "committed=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "日韓市場總覽行情快取 $(date +%Y-%m-%d)"

          # data 分支也被美股快照流程推送，兩邊時間一重疊 push 就會被拒。
          # 各自寫的是不同市場的檔案，rebase 之後重推即可。
          for attempt in 1 2 3 4 5; do
              if git push -q origin data; then
                  echo "committed=true" >> "$GITHUB_OUTPUT"
                  break
              fi

              if [ "$attempt" -eq 5 ]; then
                  echo "data 分支連續 5 次推送失敗。" >&2
                  exit 1
              fi

              echo "data 分支已被其他流程更新，rebase 後重試（第 $attempt 次）。"
              git pull -q --rebase origin data
          done

      # daily-snapshot.yml 本來只等台股自己的排程或手動觸發才 export；日韓這條commit
      # 完成後在這裡直接 dispatch publish-only，不用再靠兩條流程的執行順序碰運氣決定
      # 日韓資料何時上站。只在真的有新 commit 時觸發，避免每個交易日重複發布。
      - name: 觸發網站重新發布
        if: steps.save.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/daily-snapshot.yml/dispatches" \
              -f ref="$GITHUB_REF_NAME" \
              -f 'inputs[publish-only]=true'
