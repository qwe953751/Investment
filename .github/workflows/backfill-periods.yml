name: 補齊週月 K 摘要

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 股票代號，以空白分隔；空白表示全部台股
        default: ''
      warmup60:
        description: 只補 MA60 暖身（否則準備 MA240 暖身）
        type: boolean
        default: false

permissions:
  contents: write

# 和完整盤後流程共用 data 寫入鎖；純發布仍能讀舊的已完成快取。
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Taipei
      TICKERS: ${{ inputs.tickers }}
      WARMUP60: ${{ inputs.warmup60 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 驗證計算公式
        run: dotnet test tests/Invest.Web.Tests/Invest.Web.Tests.csproj -c Release --logger 'console;verbosity=minimal'
      - name: 補齊獨立週月摘要
        id: backfill
        continue-on-error: true
        run: |
          if [[ ! "$TICKERS" =~ ^[0-9A-Za-z[:space:]]*$ ]]; then
              echo '股票代號只能含英數字與空白。' >&2
              exit 1
          fi
          read -r -a tickers <<< "$TICKERS"
          options=()
          if [ "$WARMUP60" = 'true' ]; then options+=(--warmup60); fi
          timeout --signal=INT 19200 dotnet run -c Release --no-build --project src/Invest.Web -- backfill-periods "${tickers[@]}" "${options[@]}"
      - name: 保存已驗證的週月摘要
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          mkdir -p imports-periods
          find imports-periods -type f -name '*.json' -print0 | xargs -0 -r git add --
          if git diff --cached --name-only --diff-filter=D | grep -q .; then
              echo '偵測到摘要被刪除，停止保存。' >&2
              exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "補齊週月 K 摘要 $(date +%F)"
          for attempt in 1 2 3 4 5; do
              if git push origin HEAD:data; then exit 0; fi
              git pull --rebase origin data
          done
          exit 1
      - name: 回報回補結果
        if: ${{ !cancelled() }}
        env:
          RESULT: ${{ steps.backfill.outcome }}
        run: |
          if [ "$RESULT" != 'success' ]; then
              echo '部分摘要尚未完成，成功項目已保存；重新執行會接續。' >&2
              exit 1
          fi
          echo '摘要已保存。網站以 daily-snapshot.yml publish-only=true 另行發布。'
