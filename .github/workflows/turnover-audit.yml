# 盤中成交金額對照。**暫時的。**
#
# 每 5 分鐘同時問 MIS 與玩股網，把兩邊的成交金額差異寫進 Supabase。
# 目的是回答一個問題：我們現在用「現價 × 累計量」推算的成交值，
# 盤中到底差多少、什麼時候差、差在哪幾檔。
#
# 收滿 TurnoverAuditStore.RequiredDays（6 個完整交易日）、盤中來源換好之後，
# 這支 workflow 連同下面這些一起刪掉：
#   db/011_turnover_audit.sql（檔案裡有刪表的指令）
#   src/Invest.Web/Infrastructure/TurnoverAudit/
#   tests/Invest.Web.Tests/TurnoverAuditTests.cs
#   Program.cs 裡的 turnover-audit 指令與它的 DI 註冊
#
# 進度用 `dotnet run --project src/Invest.Web -- turnover-audit` 看（不加 --loop 就只印進度表）。

name: 盤中成交金額對照

on:
  schedule:
    # 台北時間 08:11（= UTC 週日到週四 00:11）。
    #
    # 跟 intraday.yml 同一個道理：GitHub 對單一 job 有六小時硬上限，時間到直接 cancel，
    # timeout-minutes 設多大都沒用。08:11 排程、實測誤點約半小時、約 08:40 開跑，
    # 上限落在 14:40，13:35 收工來得及。
    # 就算誤點到最糟的 88 分鐘，09:39 開跑也還收得到大半場——
    # 這支只是拿來看誤差的形狀，缺開盤那幾輪不會讓整天報廢。
    #
    # 故意排在 intraday.yml（23:33 UTC）之後：兩支都要打 MIS，錯開開跑時間，
    # 兩邊的十四個請求就不會每一輪都疊在同一秒送出去。
    - cron: '11 0 * * 1-5'
  workflow_dispatch:

# 上一場還沒收工就不要再開一場，captured_at 會撞號。
concurrency:
  group: turnover-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TZ: Asia/Taipei

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 自己撐到 13:35。整場一輪都沒寫進去、而且中間出過錯，才會紅掉；
      # 兩邊的日期都停在上一個交易日就算休市、正常結束。
      - name: 對照盤中成交金額
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: dotnet run -c Release --project src/Invest.Web -- turnover-audit --loop
