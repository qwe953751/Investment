# 拋棄式實驗：確認 GITHUB_TOKEN 到底能不能觸發 workflow_dispatch。
#
# 文件說 workflow_dispatch 與 repository_dispatch 是遞迴保護的例外，
# 但整個排程改造都要押在這句話上，所以先實測再說。驗證完這支就刪掉。

name: 自我觸發實測

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 第幾棒
        default: '0'

permissions:
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 報到並叫下一棒
        env:
          GH_TOKEN: ${{ github.token }}
          DEPTH: ${{ inputs.depth }}
        run: |
          echo "我是第 $DEPTH 棒，run id $GITHUB_RUN_ID"

          if [ "$DEPTH" -ge 2 ]; then
              echo "到第 2 棒為止，不再往下叫。"
              exit 0
          fi

          next=$(( DEPTH + 1 ))
          echo "用 GITHUB_TOKEN 叫第 $next 棒……"
          gh workflow run dispatch-probe.yml --ref main -f depth="$next"
          echo "已送出。"
